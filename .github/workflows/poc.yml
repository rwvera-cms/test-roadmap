name: Deploy to GitHub Pages

# Builds the dashboard from the workbooks in data/roadmaps/ and publishes it to GitHub Pages.
# With no workbooks there, it publishes the sample data instead.
# Repo settings: Pages → Source = GitHub Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', 'data/**', '.github/workflows/poc.yml']

permissions:
  contents: read
  pages: write      # publish to GitHub Pages
  id-token: write   # required by actions/deploy-pages

concurrency:
  group: pages
  cancel-in-progress: false   # let an in-flight Pages deploy finish

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build roadmap data
        run: |
          if ls data/roadmaps/*.xlsx >/dev/null 2>&1; then
            node scripts/build-roadmap.mjs
          else
            echo "No workbooks in data/roadmaps/; publishing sample data."
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

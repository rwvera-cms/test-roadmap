name: Build roadmap and deploy

# Company deployment (real data, Entra sign-in). Manual only during the POC.
# To switch it on, uncomment the schedule and push triggers below.
on:
  workflow_dispatch:                    # "Run workflow" button for an on-demand refresh
  # schedule:
  #   - cron: '17 11,15,19,23 * * 1-5'   # 4x per weekday (UTC); roughly 7am-7pm ET
  # push:
  #   branches: [main]
  #   paths: ['site/**', 'scripts/**', 'data/**', '.github/workflows/roadmap.yml']

concurrency:
  group: roadmap-deploy
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Source, in priority order: roadmap workbooks in data/roadmaps/, CSV exports in data/lists/, MS Lists via Graph.
      - name: Build roadmap data
        run: |
          if ls data/roadmaps/*.xlsx >/dev/null 2>&1; then
            node scripts/build-roadmap.mjs
          elif ls data/lists/*.csv >/dev/null 2>&1; then
            node scripts/csv-to-roadmap.mjs
          else
            node scripts/sync-lists.mjs
          fi
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.SYNC_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SYNC_CLIENT_SECRET }}
          SP_SITE: ${{ vars.SP_SITE }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          ORG_NAME: ${{ vars.ORG_NAME }}
          FISCAL_YEAR_START_MONTH: ${{ vars.FISCAL_YEAR_START_MONTH }}

      # roadmap.json is generated here and deployed; it is never committed to the repo.
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: site
          output_location: ''
          skip_app_build: true
